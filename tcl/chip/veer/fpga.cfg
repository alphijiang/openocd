# SPDX-License-Identifier: Apache-2.0
# OpenOCD configuration for dual-hart VeeR EH2 1.4 on Digilent Genesys 2.
#
# The onboard FT2232 JTAG port reaches the XC7K325T hardware TAP. The VeeR
# DTM is tunneled through the USER3/USER4 instructions implemented by
# rtl/bscan_tap.sv.

adapter driver ftdi
adapter usb vid_pid 0x0403 0x6010

# Genesys 2 FT2232 channel 0 is DPTI; channel 1 is FPGA JTAG.
ftdi channel 1
ftdi layout_init 0x0088 0x008b
ftdi tdo_sample_edge falling

reset_config none
adapter speed 8000
transport select jtag

set _CHIPNAME riscv

# XC7K325T hardware TAP.
jtag newtap $_CHIPNAME cpu \
    -irlen 6 \
    -expected-id 0x03651093 \
    -ignore-version

if {![info exists EH2_START_HART1]} {
    set EH2_START_HART1 0
}

set _TARGETNAME_0 $_CHIPNAME.cpu0
set _TARGETNAME_1 $_CHIPNAME.cpu1

target create $_TARGETNAME_0 riscv \
    -chain-position $_CHIPNAME.cpu \
    -coreid 0

set _TARGETS [list $_TARGETNAME_0]

# Hart 1 cannot be examined until MHARTSTART releases it.
if {$EH2_START_HART1} {
    target create $_TARGETNAME_1 riscv \
        -chain-position $_CHIPNAME.cpu \
        -coreid 1 \
        -defer-examine

    lappend _TARGETS $_TARGETNAME_1
}

# Xilinx 7-series BSCANE2 instruction mapping used by rtl/bscan_tap.sv.
riscv set_ir idcode 0x09
riscv set_ir dmi    0x22
riscv set_ir dtmcs  0x23


foreach t $_TARGETS {
    targets $t

    riscv virt2phys_mode off
    riscv set_mem_access abstract
    riscv autofence off

    # VeeR EH2 implementation-specific CSRs, including DMST (1988) and
    # MHARTSTART (2044).
    riscv expose_csrs \
        1984-1998,2000,2002-2007,2032-2034,2040-2041,2044-2045,2047,3008,3016-3020,4032,4036,4040
}

proc veer_eh2_write_dmst {tgt} {
    set previous_target [target current]
    targets $tgt

    if {[string equal [$tgt curstate] "halted"]} {
        # DMST bit 0 requests FENCE; bit 1 requests FENCE.I.
        reg csr1988 0x3
    	#echo "Clearing RISC-V Abstract Command Errors..."
    	#riscv dmi_write 0x16 0x700
    }

    targets $previous_target
}

#$_TARGETNAME_0 configure -event reset-init {
#    echo "Clearing RISC-V Abstract Command Errors..."
#    riscv dmi_write 0x16 0x700
#}

$_TARGETNAME_0 configure -event resume-start {
    
	veer_eh2_write_dmst $_TARGETNAME_0
}

$_TARGETNAME_0 configure -event step-start {
    veer_eh2_write_dmst $_TARGETNAME_0
}

if {$EH2_START_HART1} {
	#$_TARGETNAME_1 configure -event reset-init {
    #	echo "Clearing RISC-V Abstract Command Errors..."
   # 	riscv dmi_write 0x16 0x700
	#}
    $_TARGETNAME_1 configure -event resume-start {
        veer_eh2_write_dmst $_TARGETNAME_1
    }

    $_TARGETNAME_1 configure -event step-start {
        veer_eh2_write_dmst $_TARGETNAME_1
    }
}

targets $_TARGETNAME_0
init
halt

# Initialize EH2 memory/debug ordering before the first GDB operation.
reg csr1988 0x3

proc veer_eh2_start_hart1 {} {
    global _TARGETNAME_0
    global _TARGETNAME_1

    targets $_TARGETNAME_0
    halt

    # MHARTSTART.start1 is bit 1. Bit 0 reports hart 0 status.
    reg csr2044 0x2
    sleep 10

    $_TARGETNAME_1 arp_examine
    targets $_TARGETNAME_1
    halt

    # Apply DMST after hart 1 becomes accessible.
    reg csr1988 0x3

    target smp $_TARGETNAME_0 $_TARGETNAME_1
    targets $_TARGETNAME_0
}

if {$EH2_START_HART1} {
    veer_eh2_start_hart1
}
